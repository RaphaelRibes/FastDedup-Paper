name: build

on:
  push:
  pull_request:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - run: pixi run build
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
